name: Render Amharic motion graphics

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['README.md', 'output/**', 'tools/**']
  workflow_dispatch:
    inputs:
      forced_align:
        description: 'Try MMS forced alignment for word timing (slower, downloads ~1.2 GB model, cached)'
        type: boolean
        default: true

permissions:
  contents: write # only used to attach the MP4 to a GitHub Release on v* tags

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCED_ALIGN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.forced_align) || 'true' }}

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # harmless if you don't use Git LFS for the audio

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System dependencies (ffmpeg + Chrome libs for Remotion)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Embed Noto Sans Ethiopic locally
        run: npm run prepare:fonts

      - name: Analyse the voiceover → draft cue sheet
        run: npm run prepare:cues

      # ---- optional: real forced alignment (cached per audio+script hash) ----
      - name: Cache forced alignment
        id: fa-cache
        if: env.FORCED_ALIGN == 'true'
        uses: actions/cache@v4
        with:
          path: public/data/forced-alignment.json
          key: forced-${{ hashFiles('public/audio/**', 'src/data/script.json') }}

      - name: Cache Hugging Face models
        if: env.FORCED_ALIGN == 'true' && steps.fa-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mms-v1

      - uses: actions/setup-python@v5
        if: env.FORCED_ALIGN == 'true' && steps.fa-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'

      - name: MMS forced alignment (best effort — failure falls back to energy-valley timing)
        if: env.FORCED_ALIGN == 'true' && steps.fa-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git
          python scripts/align_mms.py

      - name: Rebuild cue sheet (merges forced alignment + cue-overrides.json if present)
        run: npm run prepare:cues

      - name: Validate cue sheet (strict)
        run: npm run validate:strict

      - name: Type-check (informational)
        continue-on-error: true
        run: npm run typecheck

      - name: Ensure Remotion's headless Chrome
        run: npx remotion browser ensure

      - name: QC stills at every line / emphasised word
        run: npm run stills

      - name: Render final MP4
        run: npm run render -- --log=info

      - name: Verify output (streams, resolution, fps, duration, audio match)
        run: npm run verify

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output/final-amharic-motion-graphics.mp4
          if-no-files-found: warn
          retention-days: 30

      - name: Upload timing data + sync editor + QC stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-and-qc
          path: |
            public/data/voiceover-cues.json
            public/data/audio-analysis.json
            public/data/forced-alignment.json
            public/audio/*.synced.wav
            tools/sync-editor.html
            output/stills/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Attach MP4 to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/final-amharic-motion-graphics.mp4
